services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey_dev_password
      POSTGRES_DB: journey
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d journey"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://journey:journey_dev_password@postgres:5432/journey
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-me
      JWT_ACCESS_EXPIRES_MINUTES: 30
      JWT_REFRESH_EXPIRES_DAYS: 14
      CORS_ORIGINS: '["*"]'
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:

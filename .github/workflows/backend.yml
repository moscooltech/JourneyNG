name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Ruff lint
        run: ruff check app tests migrations
      - name: Ruff format check
        run: ruff format --check app tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - name: mypy
        run: mypy app

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]" aiosqlite
      - name: Run unit + API + security tests
        run: pytest -v --tb=short --cov=app --cov-report=term
        env:
          APP_ENV: development
          JWT_SECRET: ci-only-secret-not-for-production
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          retention-days: 7

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journey
          POSTGRES_PASSWORD: journey_dev_password
          POSTGRES_DB: journey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://journey:journey_dev_password@localhost:5432/journey
          JWT_SECRET: ci-only-secret-not-for-production
      - name: Verify migration is idempotent (upgrade again)
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://journey:journey_dev_password@localhost:5432/journey
          JWT_SECRET: ci-only-secret-not-for-production

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: journey-sharing-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (non-blocking advisory report)
        run: pip-audit --skip-editable || true

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases
  packages: write # push Docker image to GHCR

jobs:
  release-apk:
    name: Release Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.0"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Tests (release gate)
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN:-}"
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}

      - name: Prepare release asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/release
          cp build/app/outputs/flutter-apk/app-release.apk \
             "/tmp/release/JourneyNG-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk.sha1 \
             "/tmp/release/JourneyNG-${VERSION}.apk.sha1" 2>/dev/null || true
          ls -lh /tmp/release

      - name: Upload workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: JourneyNG-release-apk
          path: /tmp/release/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "JourneyNG ${GITHUB_REF_NAME}" \
            --generate-notes \
            /tmp/release/*

  backend-image:
    name: Publish backend image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/journeyng-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
